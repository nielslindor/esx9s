name: PR hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  issues: write
  contents: read

jobs:
  linked-issue:
    name: Require linked issue reference
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for issue reference
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const text = `${pr.title}\n${pr.body || ''}`;
            const hasIssueRef = /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(text) || /#\d+/.test(text);

            if (!hasIssueRef) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: 'PR hygiene check: please link the issue this PR closes or supports, for example `Closes #11`.'
              });
              core.setFailed('PR must reference at least one issue.');
            }
